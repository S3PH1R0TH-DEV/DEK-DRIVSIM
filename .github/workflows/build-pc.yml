name: Build PC Kiosk (.exe Electron)

on:
  push:
    branches: [main, master]
    paths:
      - 'dek-drivsim-pc/**'
      - 'cybercafe_manager/**'
      - '.github/workflows/build-pc.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-pc:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: dek-drivsim-pc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dek-drivsim-pc/package-lock.json

      - name: Setup Python 3.11 (pour Flask embarqué)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors

      - name: Install Node deps
        run: npm ci

      - name: Build React (Vite)
        run: npm run build

      - name: Build Electron .exe (NSIS)
        run: npm run build:electron:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        run: dir dist-electron
        shell: pwsh

      - name: Upload PC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dekdrivsim-pc
          path: |
            dek-drivsim-pc/dist-electron/dekdrivsim.exe
            dek-drivsim-pc/dist-electron/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Create Release (latest + tag)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Build' }}
          files: dek-drivsim-pc/dist-electron/dekdrivsim.exe
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
