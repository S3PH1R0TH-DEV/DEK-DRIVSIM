name: Build PC Kiosk (.exe Electron)

on:
  push:
    branches: [main, master]
    paths:
      - 'dek-drivsim-pc/**'
      - 'cybercafe_manager/**'
      - '.github/workflows/build-pc.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-pc:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dek-drivsim-pc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dek-drivsim-pc/package-lock.json

      - name: Setup Python 3.11 (pour Flask embarqué)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors
        working-directory: .

      - name: Install Node deps
        run: npm ci

      - name: Build React (Vite)
        run: npm run build

      - name: Build Electron .exe (NSIS)
        run: npm run build:electron:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List artifacts
        run: dir dist-electron
        shell: pwsh

      - name: Upload PC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dek-drivsim-pc-windows
          path: |
            dek-drivsim-pc/dist-electron/*.exe
            dek-drivsim-pc/dist-electron/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dek-drivsim-pc/dist-electron/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
