name: Build & Release APK (Legacy Buildozer - DEPRECATED)

# DEPRECATED: Utiliser build-capacitor-apk.yml pour la nouvelle app Capacitor
# Ce workflow est conservé pour référence / rollback
# Pour builder la version Capacitor signée dekdrivsim : voir build-capacitor-apk.yml

on:
  workflow_dispatch:  # Seulement manuel maintenant

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v1-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v1-

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 is empty"
            exit 1
          fi
          # Nettoyage et décodage
          printf "%s" "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore
          # Diagnostic
          echo "=== Keystore Info ==="
          ls -l release.keystore
          file release.keystore

      - name: Build with Buildozer
        uses: ArtemisG/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android release
          repository_root: .
        env:
          P4A_RELEASE_KEYSTORE: release.keystore
          P4A_RELEASE_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASS: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dek-drivsim-legacy-buildozer
          path: bin/*.apk

      - name: Create Release
        if: false # Désactivé - utiliser build-capacitor-apk.yml
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (Buildozer)
          body: |
            **Build automatique DEK-DRIVSIM** — ${{ github.sha }}
            APK Release signé via Buildozer.
          files: bin/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
