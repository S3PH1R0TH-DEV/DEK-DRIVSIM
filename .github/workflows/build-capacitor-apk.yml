name: Build APK Capacitor (dekdrivsim)

on:
  push:
    branches: [main, master]
    paths:
      - 'dek-drivsim-pc/**'
      - '.github/workflows/build-capacitor-apk.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dek-drivsim-pc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: dek-drivsim-pc/package-lock.json

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node deps
        run: npm ci

      - name: Build React + Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Decode Keystore (alias dekdrivsim)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant. Voir docs/GITHUB_SECRETS.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > ../release.keystore
          ls -lh ../release.keystore
          # Vérifie alias contenu dans le keystore
          keytool -list -keystore ../release.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias dekdrivsim 2>&1 | head -20 || echo "::warning::Alias dekdrivsim non trouvé - vérifier le keystore"

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=../../release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=dekdrivsim
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          cat android/keystore.properties | sed 's/storePassword=.*/storePassword=***/' | sed 's/keyPassword=.*/keyPassword=***/'

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK (signé)
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace --info
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: dekdrivsim
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK=$(find dek-drivsim-pc/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          apksigner verify --print-certs "$APK" || jarsigner -verify -verbose -certs "$APK" | head -40

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dek-drivsim-capacitor-release
          path: dek-drivsim-pc/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dek-drivsim-pc/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: |
          rm -f ../release.keystore android/keystore.properties || true
          shred -u ../release.keystore 2>/dev/null || true
